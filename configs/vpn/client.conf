# OpenVPN Client Config - Ubuntu VNA
# Author: Alirizo Axmedov (2426806)
 
client
dev tun
proto udp
remote 72.155.89.83 1194
resolv-retry infinite
nobind
user nobody
group nogroup
persist-key
persist-tun
ca /etc/openvpn/client/ca.crt
cert /etc/openvpn/client/vna-client.crt
key /etc/openvpn/client/vna-client.key
cipher AES-256-CBC
verb 3
log /var/log/openvpn-client.log
